; GoodWe Challenge — ESP32 charging-station controller
;
;   pio run                 build
;   pio run -t upload       flash over USB
;   pio device monitor      serial console @115200
;
; Edit WIFI_SSID / WIFI_PASSWORD / BACKEND_HOST at the top of src/main.cpp
; before flashing, or pass them as build flags (see the commented block below).

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    mandulaj/PZEM-004T-v30@^1.1.2
    links2004/WebSockets@^2.4.1

build_flags =
    -DCORE_DEBUG_LEVEL=2
;   Uncomment to keep credentials out of the source file:
;   -DWIFI_SSID='"my-network"'
;   -DWIFI_PASSWORD='"my-password"'
;   -DBACKEND_HOST='"192.168.0.10"'
